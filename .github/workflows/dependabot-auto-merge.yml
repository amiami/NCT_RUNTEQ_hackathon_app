name: Dependabot auto-merge

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  auto_merge:
    # fetch-metadata v3.1.0 reads update metadata from the first commit.
    if: >-
      github.repository == 'amiami/NCT_RUNTEQ_hackathon_app' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.commits == 1 &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Read Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge for patch and minor updates
        shell: bash
        env:
          UPDATED_DEPENDENCIES: ${{ steps.metadata.outputs.updated-dependencies-json }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! jq -es '
            length == 1 and (.[0] | type == "array" and length > 0 and
              all(.[]; type == "object" and
                (.updateType == "version-update:semver-patch" or
                 .updateType == "version-update:semver-minor")))
          ' <<< "$UPDATED_DEPENDENCIES" > /dev/null; then
            echo "Skipping auto-merge: all updates must be identified as patch or minor."
            exit 0
          fi

          gh pr merge --auto --squash --match-head-commit "$PR_HEAD_SHA" "$PR_URL"
