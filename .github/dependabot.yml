# 依存ライブラリの自動更新（運用ルールは docs/kickoff.md (6) を参照）
version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: "cron"
    cronjob: "0 9 1,15 * *"
    timezone: "Asia/Tokyo"
  open-pull-requests-limit: 5
  groups:
    minor-and-patch:
      patterns:
        - "*"
      update-types:
        - "minor"
        - "patch"
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: "cron"
    cronjob: "0 9 1,15 * *"
    timezone: "Asia/Tokyo"
  open-pull-requests-limit: 5
  groups:
    minor-and-patch:
      patterns:
        - "*"
      update-types:
        - "minor"
        - "patch"
