name: 機能開発
description: エピックの子 Issue など、1 つの関心事の機能追加・変更
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        1 つの Issue は半日〜1 日で終わる大きさにします。大きすぎるときはエピックにして分解してください。
        受入条件は「テストや画面で確認できる文」で書きます。
        エピックの子 Issue は、エピックの「Sub-issues → Create sub-issue」から作ると、自動でエピックにぶら下がります。
  - type: input
    id: epic
    attributes:
      label: 親エピック
      description: エピックの子 Issue なら `Epic #番号` と書きます。エピックに属さない場合は「なし」
      placeholder: "Epic #28"
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: 背景・目的
      description: なぜ必要か。関連するユースケース（UC 番号）があれば書きます
      placeholder: |
        UC-2 マニュアルを確認する。スタッフが読んだかどうかを、版ごとに記録できるようにする。
    validations:
      required: true
  - type: textarea
    id: todo
    attributes:
      label: やること
      placeholder: |
        - 「マニュアルを確認した」ボタン
        - 押したら確認した版を保存し、レベル0なら1にする
        - Request spec
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 受入条件
      description: 何ができれば完了か。レビュワーと PdM はこの項目で合否を判定します
      value: |
        - [ ] AC-1:
        - [ ] AC-2:
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: 対象外
      description: 今回やらないこと（別の Issue に回すもの）
      placeholder: "- 検索（拡張 #35）"
  - type: textarea
    id: refs
    attributes:
      label: 参考
      description: 関係する仕様書・画面・Issue
      placeholder: |
        - 画面: モックの「作業マニュアル」タブ、docs/screens.md
        - データ: docs/data-model.md の skills
  - type: textarea
    id: dev_memo
    attributes:
      label: 開発メモ
      description: ブランチ名と PR の向き先。エピックの子 Issue は、エピックのブランチから作ります
      value: |
        - ブランチ：`epic/<エピック番号>-<説明>` から `feature/<この Issue の番号>-<説明>`
        - PR の向き先：`epic/<エピック番号>-<説明>`（CI が緑ならマージ可）
  - type: checkboxes
    id: impact
    attributes:
      label: 影響範囲
      description: 当てはまるものにチェックします（レビューの観点を決めるのに使います）
      options:
        - label: 認証・認可・個人情報・シークレットに関わる（セキュリティレビュー対象）
        - label: DB のテーブル・カラムを追加・変更する（マイグレーションあり）
        - label: 仕様書（docs/）の更新が必要
