  demo_reset:
    button: デモ用データに戻す
    confirm: すべてのデータが最初の状態に戻ります。よろしいですか？
    completed: デモ用データに戻しました
  # 画面に出すアプリ名。変えるときはここだけ直す
  app_name: マニュあっぷ

  time:
    formats:
      operation_date: "%m/%d"
      operation_full_date: "%Y/%m/%d"

  date:
    formats:
      operation_full_date: "%Y/%m/%d"

  operations:
    staff_status:
      title: この作業のスタッフ状況
      empty: スタッフが登録されていません
      # 研修の文（skill_statuses.training）に付ける前置き
      training: "研修：%{status}"
    tree_label: 作業ツリー
    level_prefix: レベル
    external_marker: URL
    kinds:
      internal: アプリ内
      external: 外部サイト
    version: "第%{version}版"
    capable_count: "できる人%{count}人"
    revision_badge: "改定 %{date}"
    last_revised: "最終改定：%{date}"
    no_revision: 改定なし
    season: "時期：%{note}"
    external_hint: 手順は外部サイト・ソフトのガイドを見てください
    open_site: サイトを開く
    no_manual: この作業のマニュアルはまだ登録されていません
    empty: 作業がまだ登録されていません
    empty_manual: 作業が登録されると、ここにマニュアルを表示します
    external_revision_label: 法改正・様式・サイトに変更があったとき
    external_revision_placeholder: 変更内容のメモ（例：届出の様式が変わった）
    external_revision_save: 改定あり
    external_revision_hint: 保存すると版が上がります。URL・スキルレベル・管理者の見立ては変わりません
    external_revision_stale: マニュアルが更新されました。最新の版と変更内容を確認してから、改めて保存してください
    revision_edit: 手順を書き直す（改定）
    revision_body: 手順（1行＝1ステップ）
    revision_memo: 改定メモ（何が変わったか）
    revision_memo_example: 例：貸与物の返却リストを更新
    revision_save: 改定して保存
    revision_cancel: やめる
    revision_hint: 保存すると版が上がります。スキルレベル・管理者の見立ては変わりません
    revised_notice: マニュアルを改定しました
    revision_invalid: 手順を入力してください
    revision_stale: マニュアルが更新されました。「やめる」で最新の手順を確認してから、編集し直してください
    confirmation_label: マニュアルの確認
    my_skill_level: わたしのスキルレベル
    # 本人のレベルに合わせて、マニュアルの下に出すヒント（次に何をすればよいか）
    level_hints:
      "0": マニュアルを読んで「マニュアルを確認した」を押すとレベル1になります。
      "1": 研修を受けるとレベル2になります。自分で覚えてできるようになった場合は、下の自己申告を押してください。
      "2": 研修済みです。先輩についてもらえばできるようになったら、下の「先輩のもとでできる」を押してください。
      "3": 最後まで1人でできるようになったら、下の「最後まで1人でできる」を押してください。
      "4": 最後まで1人でできる状態です。まわりの人のサポートをお願いすることがあります。
    confirm_button: マニュアルを確認した
    confirmed_button: マニュアル確認済み
    confirmed_notice: マニュアルを確認しました
    confirmation_stale: マニュアルが更新されました。内容を確認して、もう一度押してください
    self_declaration_label: 自己申告
    declare_buttons:
      "3": 先輩のもとでできる（レベル3）
      "4": 最後まで1人でできる（レベル4）
    self_declared_notice: "レベル%{level}（%{name}）を申告しました"
    not_declarable: 今のレベルからは申告できません
    relearn_badge: 再確認
    revised_alert: このマニュアルは改定されました

  # アプリ固有の翻訳（モデル名・属性名など）はここに書く。
  # エラーメッセージや日付などの Rails 標準の翻訳は rails-i18n gem に入っている

  activerecord:
    attributes:
      skill:
        user: 人
      training:
        operation: 作業
        trainer: 教える人
        trainee: 教わる人
        trainee_id: 教わる人
    errors:
      models:
        skill:
          attributes:
            user:
              not_skill_holder: はスキルを持つ人（管理者以外）にしてください
        training:
          attributes:
            trainee:
              same_as_trainer: は教える人と別の人にしてください
              not_trainee_candidate: はこの作業で教わる人の条件を満たしていません
            trainer:
              not_trainer_candidate: はこの作業で教える人の条件を満たしていません
            base:
              cannot_destroy_done: 完了した研修予定は削除できません
            trainee_id:
              taken: にはこの作業で完了していない研修予定がすでにあります

  page_titles:
    admin: "管理者：%{page}"
    staff: "スタッフ：%{page}"

  training_plan:
    saved: 研修予定を保存しました
    not_saved: 研修予定を保存できませんでした。内容を確かめて、もう一度保存してください
    errors:
      not_found: 取り消す研修予定が見つかりません
      duplicated: 同じ人の未完了の研修予定がすでにあります。画面を開き直してください
      invalid_due_on: 期限の日付が正しくありません

  # 研修予定の期限の表示（研修画面・わたしのスキルで共通）
  training_due_on:
    date: 期限：%{date}
    none: 期限：未設定

  # 管理者の見立ての記号と説明（管理者の画面だけで使う。スタッフの画面には出さない）
  admin_assessments:
    can_train:
      mark: ▲
      label: 指導できる
    needs_training:
      mark: ▼
      label: 要研修
    training_done:
      mark: ▽
      label: 研修済み（▼から研修を受け終えた）
    backup_trainer:
      mark: ◇
      label: 指導に不安あり

  admin:
    trainings:
      index:
        hint: 未研修の人を選んで「教える人」を押すと、研修予定の下書きができます（誰も選ばなければ、残っている未研修の人全員）。右下の「変更を保存」を押すと「指示済みの研修」に入ります。
        filter_label: 作業の絞り込み
        filters:
          all: すべて
          needs_instruction: 指示が必要
          assigned: 指示済み
        cards_label: 研修が必要な作業
        empty: 該当する作業はありません
        assigned_title: 指示済みの研修（%{count}件）
        assigned_empty: まだありません。作業の「教える人」を押して下書きを作り、「変更を保存」を押すと、ここに出ます。
        save: 変更を保存
        unsaved_note: （まだ保存されていません!）
        plan_remove_label: "%{trainer} → %{trainee} の予定を取り消す"
      card:
        capable_count: できる人%{count}人
        due_label: "%{name}の研修期限"
        columns:
          due_on: 日付
          trainers: 教える人
          trainees: 未研修
          trainings: 研修予定
        no_trainees: 対象者なし
        no_trainings: 予定なし
        plan_label: "%{trainer} から %{trainee} への研修予定"
      assigned_training:
        statuses:
          by_admin: 管理者が担当
          acknowledged: 教える人が確認済み
          requested: 教える人が未確認
        declared: （本人がレベル3以上に申告済み）
        done: 教え終わった
        cancel: 取り消す
        undo_cancel: 取り消しをやめる
    skill_maps:
      show:
        operations_count: "%{count}作業"
        capable_count: "できる人%{count}人"
        few_capable_operations: "できる人1人以下 %{count}件"
        few_capable_warning: "できる人（1人でできる＝レベル4）が1人以下の作業が%{count}件あります"
        few_capable_warning_description: 担当者が休んだり辞めたりすると止まる恐れがあります。研修画面で優先して教える人を決めましょう。
        few_capable_filter: できる人が1人以下の作業だけ表示
        save: 変更を保存
        unsaved_note: （まだ保存されていません!）
      cell:
        unread: 未読
        unread_description: 改定後のマニュアルをまだ確認していません
    skills:
      show:
        title: "%{user} × %{operation}"
        manual_status: マニュアル確認状況
        training: 研修
        admin_assessment: 管理者の見立て
        no_assessment: なし
        # 今のレベルで意味のない見立て（マスには出さない）に添える説明。レベル・見立ての組み合わせで引く
        hidden_assessment_notes:
          level_4:
            can_train: レベル3になっても、教える人の候補に残ります
            training_done: ▼から研修を受け終えました（いまは普通のレベル4として扱います）
          level_3:
            backup_trainer: レベル4になると、教える人の候補の後ろに並びます
    manual_revisions:
      index:
        list_label: 改訂履歴の一覧
        columns:
          date: 日付
          operation: 作業
          kind: 種類
          memo: 変更内容
          link: マニュアル
        no_memo: （メモなし）
        open_manual: マニュアルを見る
        empty: 改訂はまだありません

  staff:
    skills:
      index:
        skill_list_label: わたしのスキルの一覧
      skill_list:
        count_unit: 件
        trained: 研修済み
        level: レベル%{level}
      trainings:
        teaching_title: 教える予定
        learning_title: 教わる予定
        trainee: 教える相手：%{name}
        trainer: 教えてくれる人：%{name}
        declared: （本人がレベル3以上に申告済み）
        trained: 研修済みになりました（%{name}から・%{date}）
        manual: マニュアルを見る
        done: 教え終わった
        empty: いまはありません

  training_completion:
    done: 「教え終わった」にしました。教わった人は研修済みになります
    errors:
      already_done: この研修予定はすでに完了しています
      not_trainer: この研修予定の教える人だけが「教え終わった」にできます
      not_saved: 「教え終わった」にできませんでした。画面を開き直して、もう一度押してください

  operators:
    role_switch_label: 立場の切り替え
    current_label: ログイン中：
    switch_label: 操作する人の切り替え
    label: 操作する人
    submit: 切り替え
    not_selectable: 選べない人です。操作する人は変わっていません
    admin_only: 管理者の画面は、管理者（部長）に切り替えると開けます

  navigation:
    roles:
      admin: 管理者（部長）
      staff: スタッフ
    admin:
      operations: 作業ツリー（マニュアル）
      skill_map: スキルマップ
      trainings: 研修
      manual_revisions: 改訂履歴
    staff:
      operations: 作業マニュアル
      skills: わたしのスキル
      manual_revisions: 改訂のお知らせ

  skill_levels:
    "0": 未着手
    "1": マニュアル確認済み
    "2": 研修済み（教わった）
    "3": 先輩のもとでできる
    "4": 作業を最後まで1人でできる

  # マニュアル確認状況（Skill#manual_status）と研修（Skill#training_status）の文。
  # 作業ツリーのスタッフ状況とスキルマップのマスの詳細で共通に使う（SkillsHelper）
  skill_statuses:
    manual:
      unconfirmed: 未確認
      unread: 改定後 未確認
      confirmed: 確認済み
    training:
      done: "済み（%{trainer}から・%{date}）"
      self_taught: なし（自分で習得）
      not_yet: まだ
    # 教えた人がスタッフのときの呼び方（管理者は名前だけ）
    staff_name: "%{name}さん"

  app_department: 株式会社〇〇 人事部

  skill_level_short_labels:
    "0": 未着手
    "1": 確認済み
    "2": 研修済み
    "3": 先輩のもと
    "4": 1人でできる

  skill_level_descriptions:
    "0": まだ何もしていない
    "1": マニュアルを読んで「確認した」を押した
    "2": 教えた人が「教え終わった」を押した
    "3": 本人が自己申告
    "4": 本人が自己申告

  # マスや名前の横に出す印と、マウスを乗せたときの説明（admin/shared/_assessment_mark）
  admin_assessment_marks:
    can_train:
      symbol: ▲
      description: 指導できる：レベル3だが、すでに教えられる
    needs_training:
      symbol: ▼
      description: 要研修：研修が必要
    training_done:
      symbol: ▽
      description: 研修済み：▼の人が研修を受け終えた
    backup_trainer:
      symbol: ◇
      description: 指導に不安あり：1人で作業はできるが、教えるのは少し不得意

  skills:
    assessments:
      update:
        saved: 管理者の見立てを保存しました
        failed: 管理者の見立てを保存できませんでした
      errors:
        not_assignable: "%{user}さんの「%{operation}」：%{assessment}はレベル%{level}のときだけ付けられます"
        invalid: "%{user}さんの「%{operation}」：選べない見立てです"

  # 下書きの「変更を保存」と、保存しないまま移るときの確認（unsaved-changes コントローラ）
  unsaved_changes:
    confirm_leaving: 変更は保存されませんがよろしいですか？
