ja:
  # 画面に出すアプリ名。変えるときはここだけ直す
  app_name: マニュあっぷ

  # アプリ固有の翻訳（モデル名・属性名など）はここに書く。
  # エラーメッセージや日付などの Rails 標準の翻訳は rails-i18n gem に入っている

  activerecord:
    attributes:
      skill:
        user: 人
      training:
        operation: 作業
        trainer: 教える人
        trainee: 教わる人
        trainee_id: 教わる人
    errors:
      models:
        skill:
          attributes:
            user:
              not_skill_holder: はスキルを持つ人（管理者以外）にしてください
        training:
          attributes:
            trainee:
              same_as_trainer: は教える人と別の人にしてください
              not_trainee_candidate: はこの作業で教わる人の条件を満たしていません
            trainer:
              not_trainer_candidate: はこの作業で教える人の条件を満たしていません
            base:
              cannot_destroy_done: 完了した研修予定は削除できません
            trainee_id:
              taken: にはこの作業で完了していない研修予定がすでにあります

  page_titles:
    admin: "管理者：%{page}"
    staff: "スタッフ：%{page}"

  training_plan:
    saved: 研修予定を保存しました
    not_saved: 研修予定を保存できませんでした。内容を確かめて、もう一度保存してください
    errors:
      not_found: 取り消す研修予定が見つかりません
      duplicated: 同じ人の未完了の研修予定がすでにあります。画面を開き直してください
      invalid_due_on: 期限の日付が正しくありません

  # 研修予定の期限の表示（研修画面・わたしのスキルで共通）
  training_due_on:
    date: 期限：%{date}
    none: 期限：未設定

  # 管理者の見立ての記号と説明（管理者の画面だけで使う。スタッフの画面には出さない）
  admin_assessments:
    can_train:
      mark: ▲
      label: 研修権限
    needs_training:
      mark: ▼
      label: 要研修
    training_done:
      mark: ▽
      label: 研修済み（▼から研修を受け終えた）
    backup_trainer:
      mark: ◇
      label: 教えるのは後回し

  admin:
    trainings:
      index:
        hint: 未研修の人を選んで「教える人」を押すと、研修予定の下書きができます（誰も選ばなければ、残っている未研修の人全員）。右下の「変更を保存」を押すと「指示済みの研修」に入ります。
        filter_label: 作業の絞り込み
        filters:
          all: すべて
          needs_instruction: 指示が必要
          assigned: 指示済み
        cards_label: 研修が必要な作業
        empty: 該当する作業はありません
        assigned_title: 指示済みの研修（%{count}件）
        assigned_empty: まだありません。作業の「教える人」を押して下書きを作り、「変更を保存」を押すと、ここに出ます。
        save: 変更を保存
        unsaved_note: （まだ保存されていません!）
      card:
        capable_count: できる人%{count}人
        due_label: "%{name}の研修期限"
        columns:
          due_on: 日付
          trainers: 教える人
          trainees: 未研修
          trainings: 研修予定
        no_trainees: 対象者なし
        no_trainings: 予定なし
        plan_label: "%{trainer} から %{trainee} への研修予定"
      assigned_training:
        statuses:
          by_admin: 管理者が担当
          acknowledged: 教える人が確認済み
          requested: 教える人が未確認
        declared: （本人がレベル3以上に申告済み）
        done: 教え終わった
        cancel: 取り消す
        undo_cancel: 取り消しをやめる

  training_completion:
    done: 「教え終わった」にしました。教わった人は研修済みになります
    errors:
      already_done: この研修予定はすでに完了しています
      not_trainer: この研修予定の教える人だけが「教え終わった」にできます
      not_saved: 「教え終わった」にできませんでした。画面を開き直して、もう一度押してください

  operators:
    switch_label: 操作する人の切り替え
    label: 操作する人
    submit: 切り替え
    not_selectable: 選べない人です。操作する人は変わっていません
    admin_only: 管理者の画面は、管理者（部長）に切り替えると開けます

  navigation:
    roles:
      admin: 管理者（部長）
      staff: スタッフ
    admin:
      operations: 作業ツリー（マニュアル）
      skill_map: スキルマップ
      trainings: 研修
      manual_revisions: 改訂履歴
    staff:
      operations: 作業マニュアル
      skills: わたしのスキル
      manual_revisions: 改訂のお知らせ

  skill_levels:
    "0": 未着手
    "1": マニュアル確認済み
    "2": 研修済み（教わった）
    "3": 先輩のもとでできる
    "4": 作業を最後まで1人でできる

  app_department: 株式会社〇〇 人事部

  skill_level_short_labels:
    "0": 未着手
    "1": 確認済み
    "2": 研修済み
    "3": 先輩のもと
    "4": 1人でできる

  skill_level_descriptions:
    "0": まだ何もしていない
    "1": マニュアルを読んで「確認した」を押した
    "2": 教えた人が「教え終わった」を押した
    "3": 本人が自己申告
    "4": 本人が自己申告

  # 下書きの「変更を保存」と、保存しないまま移るときの確認（unsaved-changes コントローラ）
  unsaved_changes:
    confirm_leaving: 変更は保存されませんがよろしいですか？
