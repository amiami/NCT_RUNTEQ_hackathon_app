ja:
  # 画面に出すアプリ名。変えるときはここだけ直す
  app_name: マニュあっぷ

  time:
    formats:
      operation_date: "%m/%d"
      operation_full_date: "%Y/%m/%d"

  date:
    formats:
      operation_full_date: "%Y/%m/%d"

  operations:
    staff_status:
      title: この作業のスタッフ状況
      empty: スタッフが登録されていません
      confirmations:
        unconfirmed: 未確認
        revised: 改定後 未確認
        confirmed: 確認済み
      trainer_name: "%{name}さん"
      trained: "研修：済み（%{trainer}から・%{date}）"
      self_learned: 研修：なし（自分で習得）
      not_trained: 研修：まだ
    tree_label: 作業ツリー
    level_prefix: レベル
    external_marker: URL
    kinds:
      internal: アプリ内
      external: 外部サイト
    version: "第%{version}版"
    capable_count: "できる人%{count}人"
    revision_badge: "改定 %{date}"
    last_revised: "最終改定：%{date}"
    no_revision: 改定なし
    season: "時期：%{note}"
    external_hint: 手順は外部サイト・ソフトのガイドを見てください
    open_site: サイトを開く
    no_manual: この作業のマニュアルはまだ登録されていません
    empty: 作業がまだ登録されていません
    empty_manual: 作業が登録されると、ここにマニュアルを表示します
    external_revision_label: 法改正・様式・サイトに変更があったとき
    external_revision_placeholder: 変更内容のメモ（例：届出の様式が変わった）
    external_revision_save: 改定あり
    external_revision_hint: 保存すると版が上がります。URL・スキルレベル・管理者の見立ては変わりません
    external_revision_stale: マニュアルが更新されました。最新の版と変更内容を確認してから、改めて保存してください
    revision_edit: 手順を書き直す（改定）
    revision_body: 手順（1行＝1ステップ）
    revision_memo: 改定メモ（何が変わったか）
    revision_memo_example: 例：貸与物の返却リストを更新
    revision_save: 改定して保存
    revision_cancel: やめる
    revision_hint: 保存すると版が上がります。スキルレベル・管理者の見立ては変わりません
    revised_notice: マニュアルを改定しました
    revision_invalid: 手順を入力してください
    revision_stale: マニュアルが更新されました。「やめる」で最新の手順を確認してから、編集し直してください
    confirmation_label: マニュアルの確認
    my_skill_level: わたしのスキルレベル
    confirmation_hint: 内容を読んで「マニュアルを確認した」を押してください。レベル0の人はレベル1になります
    confirmed_hint: この版のマニュアルは確認済みです
    confirm_button: マニュアルを確認した
    confirmed_button: マニュアル確認済み
    confirmed_notice: マニュアルを確認しました
    confirmation_stale: マニュアルが更新されました。内容を確認して、もう一度押してください

  # アプリ固有の翻訳（モデル名・属性名など）はここに書く。
  # エラーメッセージや日付などの Rails 標準の翻訳は rails-i18n gem に入っている

  activerecord:
    attributes:
      skill:
        user: 人
      training:
        operation: 作業
        trainer: 教える人
        trainee: 教わる人
        trainee_id: 教わる人
    errors:
      models:
        skill:
          attributes:
            user:
              not_skill_holder: はスキルを持つ人（管理者以外）にしてください
        training:
          attributes:
            trainee:
              same_as_trainer: は教える人と別の人にしてください
              not_trainee_candidate: はこの作業で教わる人の条件を満たしていません
            trainer:
              not_trainer_candidate: はこの作業で教える人の条件を満たしていません
            base:
              cannot_destroy_done: 完了した研修予定は削除できません
            trainee_id:
              taken: にはこの作業で完了していない研修予定がすでにあります

  page_titles:
    admin: "管理者：%{page}"
    staff: "スタッフ：%{page}"

  operators:
    switch_label: 操作する人の切り替え
    label: 操作する人
    submit: 切り替え
    not_selectable: 選べない人です。操作する人は変わっていません
    admin_only: 管理者の画面は、管理者（部長）に切り替えると開けます

  navigation:
    roles:
      admin: 管理者（部長）
      staff: スタッフ
    admin:
      operations: 作業ツリー（マニュアル）
      skill_map: スキルマップ
      trainings: 研修
      manual_revisions: 改訂履歴
    staff:
      operations: 作業マニュアル
      skills: わたしのスキル
      manual_revisions: 改訂のお知らせ

  skill_levels:
    "0": 未着手
    "1": マニュアル確認済み
    "2": 研修済み（教わった）
    "3": 先輩のもとでできる
    "4": 作業を最後まで1人でできる

  app_department: 株式会社〇〇 人事部

  skill_level_short_labels:
    "0": 未着手
    "1": 確認済み
    "2": 研修済み
    "3": 先輩のもと
    "4": 1人でできる

  skill_level_descriptions:
    "0": まだ何もしていない
    "1": マニュアルを読んで「確認した」を押した
    "2": 教えた人が「教え終わった」を押した
    "3": 本人が自己申告
    "4": 本人が自己申告

  # 管理者の見立て。管理者画面だけで使い、スタッフ画面には出さない
  admin_assessments:
    can_train: ▲ 指導できる
    needs_training: ▼ 要研修
    training_done: ▽ 研修済み
    backup_trainer: ◇ 指導に不安あり

  # マスや名前の横に出す印と、マウスを乗せたときの説明（admin/shared/_assessment_mark）
  admin_assessment_marks:
    can_train:
      symbol: ▲
      description: 指導できる：レベル3だが、すでに教えられる
    needs_training:
      symbol: ▼
      description: 要研修：研修が必要
    training_done:
      symbol: ▽
      description: 研修済み：▼の人が研修を受け終えた
    backup_trainer:
      symbol: ◇
      description: 指導に不安あり：1人で作業はできるが、教えるのは少し不得意

  skills:
    assessments:
      update:
        saved: 管理者の見立てを保存しました
        failed: 管理者の見立てを保存できませんでした
      errors:
        not_assignable: "%{user}さんの「%{operation}」：%{assessment}はレベル%{level}のときだけ付けられます"
        invalid: "%{user}さんの「%{operation}」：選べない見立てです"

  admin:
    skill_maps:
      show:
        operations_count: "%{count}作業"
        capable_count: "できる人%{count}人"
        few_capable_operations: "できる人1人以下 %{count}件"
        few_capable_warning: "できる人（1人でできる＝レベル4）が1人以下の作業が%{count}件あります"
        few_capable_warning_description: 担当者が休んだり辞めたりすると止まる恐れがあります。研修画面で優先して教える人を決めましょう。
        few_capable_filter: できる人が1人以下の作業だけ表示
        save: 変更を保存
        unsaved_note: （まだ保存されていません!）
      cell:
        unread: 未読
        unread_description: 改定後のマニュアルをまだ確認していません
    skills:
      show:
        title: "%{user} × %{operation}"
        manual_status: マニュアル確認状況
        manual_statuses:
          unconfirmed: 未確認
          unread: 改定後 未確認
          confirmed: 確認済み
        training: 研修
        trainings:
          done: "済み（%{trainer}から・%{date}）"
          self_taught: なし（自分で習得）
          not_yet: まだ
        # 教えた人がスタッフのときの呼び方（管理者は名前だけ）
        staff_name: "%{name}さん"
        admin_assessment: 管理者の見立て
        no_assessment: なし
        # 今のレベルで意味のない見立て（マスには出さない）に添える説明。レベル・見立ての組み合わせで引く
        hidden_assessment_notes:
          level_4:
            can_train: レベル3になっても、教える人の候補に残ります
            training_done: ▼から研修を受け終えました（いまは普通のレベル4として扱います）
          level_3:
            backup_trainer: レベル4になると、教える人の候補の後ろに並びます

  # 下書きの「変更を保存」と、保存しないまま移るときの確認（unsaved-changes コントローラ）
  unsaved_changes:
    confirm_leaving: 変更は保存されませんがよろしいですか？
